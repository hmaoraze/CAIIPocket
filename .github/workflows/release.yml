name: Release Build

# 发版时自动构建：只在 Release 发布（published）时触发，
# 构建产物（APK / 未签名 IPA）自动挂到该 Release 的 Assets 下。
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.0
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build APK (release, debug 签名)
        run: flutter build apk --release

      - name: Read version from pubspec
        id: ver
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/CAIIPocket_android_${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CAIIPocket_android_*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'release'

      - name: Upload artifact (workflow_dispatch 时)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: CAIIPocket_android_apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_ios:
    name: Build iOS IPA (未签名)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.0
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build IPA (no codesign)
        run: |
          flutter build ipa --release --no-codesign
          # 未签名产物在 build/ios/archive 之外，直接从 xcarchive 提取 Payload
          mkdir -p dist
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app dist/Runner.app

      - name: Pack unsigned IPA
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          cd dist
          mkdir Payload
          cp -r Runner.app Payload/Runner.app
          zip -r "CAIIPocket_ios_${VERSION}_no_sign.ipa" Payload
          rm -rf Payload Runner.app
          cd ..

      - name: Upload IPA to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CAIIPocket_ios_*_no_sign.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'release'

      - name: Upload artifact (workflow_dispatch 时)
        uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: CAIIPocket_ios_ipa
          path: dist/CAIIPocket_ios_*_no_sign.ipa
